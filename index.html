<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151713">
<title>Hotel Guest Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141612;--panel:#20221c;--gold:#c6a878;--cream:#f3ecdf;--muted:#aaa394;--line:rgba(198,168,120,.24)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
.hero{height:62vh;min-height:430px;max-height:680px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#0005,#0002,#141612),var(--cover) center/cover}
nav{display:flex;justify-content:space-between;padding:25px 7%;letter-spacing:3px;font-size:12px}.logo{font:26px 'Cormorant Garamond',serif}
.heroText{text-align:center;padding:0 20px 75px}.heroText small{color:var(--gold);letter-spacing:5px}.heroText h1{font:clamp(48px,9vw,85px) 'Cormorant Garamond',serif;margin:15px 0}.heroText p{font-size:12px;letter-spacing:2px}
.welcome{text-align:center;max-width:680px;margin:auto;padding:10px 25px 35px}.welcome small{color:var(--gold);letter-spacing:4px}.welcome h2{font:40px 'Cormorant Garamond',serif;margin:12px}.welcome p{font-size:12px;line-height:1.9;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:10px 22px 60px}.heading{color:var(--gold);font-size:10px;letter-spacing:3px;margin:15px 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid var(--line);background:linear-gradient(140deg,#24261f,#191b17);padding:20px;min-height:130px;cursor:pointer}.item:hover{border-color:var(--gold)}.ico{color:var(--gold);font-size:22px}.item h3{font:22px 'Cormorant Garamond',serif;margin:12px 0 4px}.item p{font-size:10px;color:var(--muted)}
footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:var(--muted);font-size:10px;letter-spacing:2px}
.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#20221c;border:1px solid var(--gold);padding:30px;max-width:400px;width:100%;text-align:center;position:relative}.box h2{font:34px 'Cormorant Garamond',serif}.box p{font-size:12px;color:var(--muted);line-height:1.8}.box button,.box a{display:inline-block;background:var(--gold);color:#111;padding:13px 20px;border:0;margin-top:18px;text-decoration:none;font-size:11px}.close{position:absolute;right:12px;top:8px;background:none!important;color:white!important;padding:5px!important;margin:0!important}.wifi{background:#111;padding:12px;color:var(--gold);margin:10px 0;overflow-wrap:anywhere}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}nav{padding:20px 5%}.logo{font-size:21px}}
</style></head><body>
<header class="hero" id="hero"><nav><div class="logo" id="logo">HOTEL</div><span>GUEST EXPERIENCE</span></nav><div class="heroText"><small>A PLACE TO REMEMBER</small><h1>Welcome.</h1><p id="subtitle"></p></div></header>
<section class="welcome"><small>YOUR STAY, YOUR EXPERIENCE</small><h2 id="welcomeTitle">Hoş Geldiniz</h2><p id="welcomeText"></p></section>
<main><div class="heading">GUEST SERVICES · MİSAFİR HİZMETLERİ</div><div class="grid" id="grid"></div></main>
<footer id="footer"></footer>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="mt"></h2><p id="mp"></p><div id="mx"></div><a id="ma" href="#" target="_blank">OPEN</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
(async()=>{
const cfg=window.APP_CONFIG||{};
if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('BURAYA')){document.getElementById('welcomeText').textContent='Otel sayfası henüz yapılandırılmadı.';return;}
const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get('id');
if(!id){document.getElementById('welcomeText').textContent='Otel bilgisi bulunamadı.';return;}
const {data:h,error}=await sb.from('hotels').select('*').eq('id',id).eq('is_active',true).single();
if(error||!h){document.getElementById('welcomeText').textContent='Bu otel bulunamadı veya yayında değil.';return;}
document.title=h.name+' | Guest Experience';
document.getElementById('logo').textContent=h.name;
document.getElementById('hero').style.setProperty('--cover',`url("${h.cover_image||'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1800&q=80'}")`);
document.getElementById('subtitle').textContent=h.description||'DISCOVER A BEAUTIFUL WAY TO STAY';
document.getElementById('welcomeTitle').textContent=h.welcome_title||'Hoş Geldiniz';
document.getElementById('welcomeText').textContent=h.welcome_text||'Konaklamanızı daha konforlu hale getirmek için tüm hizmetlerimiz burada.';
document.getElementById('footer').textContent=h.name+' · YOUR COMFORT IS OUR PRIORITY';
const items=[
['instagram','◎','Instagram','Bizi takip edin'],['whatsapp','◉','WhatsApp','Bizimle iletişime geçin'],['wifi','⌁','Wi-Fi','Kablosuz internet'],['menu','✧','Restaurant Menu','Menüyü görüntüleyin'],['reception','♧','Reception','Resepsiyonu arayın'],['google','☆','Google Reviews','Deneyiminizi paylaşın'],['tripadvisor','✧','Tripadvisor','Otelimizi değerlendirin'],['room_service','♨','Room Service','Oda servisi'],['housekeeping','✦','Housekeeping','Oda ihtiyaçları'],['transfer','◇','Transfer','Ulaşım desteği'],['location','⌖','Location','Otelin konumu'],['breakfast','☼','Breakfast','Kahvaltı saatleri'],['checkout','◷','Check-out','Çıkış bilgisi'],['about','⌂','About Us','Otel hakkında'],['emergency','+','Important Info','Önemli bilgiler']
];
const labels={instagram:'Instagram',whatsapp:'WhatsApp',wifi:'Wi-Fi',menu:'Menü',reception:'Resepsiyon',google:'Google yorumları',tripadvisor:'Tripadvisor',room_service:'Oda servisi',housekeeping:'Housekeeping',transfer:'Transfer',location:'Konum',breakfast:'Kahvaltı',checkout:'Check-out',about:'Otel hakkında',emergency:'Önemli bilgiler'};
const grid=document.getElementById('grid');
items.forEach(i=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="ico">${i[1]}</div><h3>${i[2]}</h3><p>${i[3]}</p>`;d.onclick=()=>open(i[0],i[2]);grid.append(d)});
function open(key,title){
 document.getElementById('mt').textContent=title;
 const extra=document.getElementById('mx'),a=document.getElementById('ma'),p=document.getElementById('mp');
 extra.innerHTML='';a.style.display='inline-block';a.removeAttribute('href');a.onclick=null;
 const text={wifi:'Ağa bağlanmak için aşağıdaki bilgileri kullanın.',breakfast:h.breakfast_hours,checkout:h.checkout_info,about:h.about_text,emergency:h.emergency_info};
 if(key==='wifi'){
  extra.innerHTML='<div class="wifi">AĞ: '+esc(h.wifi_name)+'</div><div class="wifi">ŞİFRE: '+esc(h.wifi_password)+'</div>';
  p.textContent=text.wifi;a.textContent='ŞİFREYİ KOPYALA';a.onclick=async e=>{e.preventDefault();try{await navigator.clipboard.writeText(h.wifi_password);a.textContent='KOPYALANDI ✓'}catch{a.textContent='KOPYALANAMADI'}};
 }else if(['breakfast','checkout','about','emergency'].includes(key)){
  p.textContent=text[key]||'Bu bilgi henüz eklenmemiş.';a.style.display='none';
 }else{
  p.textContent='Hizmet için ilgili bağlantıyı açın.';
  const url=h[key+'_url']||(key==='room_service'?h.room_service_url:'');
  if(!url){a.textContent='HENÜZ EKLENMEDİ';a.style.opacity='.5'}
  else{a.textContent='AÇ / İLETİŞİME GEÇ';a.href=key==='reception'?'tel:'+h.reception_phone:url;a.target=key==='reception'?'_self':'_blank'}
 }
 document.getElementById('modal').classList.add('show');
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.closeModal=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
})();
</script></body></html>
